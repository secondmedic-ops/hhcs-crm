name: ship
# Every push to main (SHIP.bat, Claude, or AI Studio - any size) runs this ONE ordered pipeline.
# Nothing touches production until steps 1-3 pass. Then: migrations -> ONE wrangler deploy (frontend + API) -> smoke -> record.
# Everything runs on free plans: Cloudflare Workers Free (+ Hyperdrive, Durable Object live hub) and Supabase.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or deploy-* tag to redeploy (rollback). Empty = latest main."
        required: false
      skip_db:
        description: "Skip migrations (use for rollback)"
        type: boolean
        default: false
concurrency:
  group: ship
  cancel-in-progress: false
permissions:
  contents: write
env:
  APP_URL: ${{ vars.APP_URL }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          # A fixed version: "latest" asks the GitHub API, which fails when its hourly limit is used up.
          version: 2.118.0

      - name: 1. Guard - AI Studio must not change API/db/pipeline files
        if: github.event_name == 'push'
        run: node scripts/guard.mjs "${{ github.event.before }}" "${{ github.sha }}"

      - name: 2. Lint migrations, placeholders and security rules
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/lint.mjs

      - name: 3a. Local database built from all migrations
        run: supabase db start

      - name: 3b. API (Worker) - typecheck and the case-workflow database test
        working-directory: cloudflare
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p .
          npx vitest run

      - name: 3c. Rehearsal - the real Worker on the local DB (schema check, login required, API tests, contract)
        run: node scripts/rehearse.mjs

      - name: 3d. Frontend - API calls match the Worker, typecheck, build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          node scripts/check-api.mjs
          npm ci --no-audit --no-fund
          npx -y -p typescript@5 tsc --noEmit -p .
          npm run build

      - name: 4. Apply migrations to production Supabase
        if: ${{ !inputs.skip_db }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: 5. Deploy frontend + API together (one Worker, Cloudflare free plan)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MYOPERATOR_WEBHOOK_KEY: ${{ secrets.MYOPERATOR_WEBHOOK_KEY }}
          MYOPERATOR_COMPANY_ID: ${{ secrets.MYOPERATOR_COMPANY_ID }}
          MYOPERATOR_SECRET_TOKEN: ${{ secrets.MYOPERATOR_SECRET_TOKEN }}
          MYOPERATOR_OBD_API_KEY: ${{ secrets.MYOPERATOR_OBD_API_KEY }}
          MYOPERATOR_PUBLIC_IVR_ID: ${{ secrets.MYOPERATOR_PUBLIC_IVR_ID }}
          MYOPERATOR_API_TOKEN: ${{ secrets.MYOPERATOR_API_TOKEN }}
          MYOPERATOR_WABA_API_KEY: ${{ secrets.MYOPERATOR_WABA_API_KEY }}
          MYOPERATOR_WABA_PHONE_ID: ${{ secrets.MYOPERATOR_WABA_PHONE_ID }}
          MYOPERATOR_CALLER_ID: ${{ secrets.MYOPERATOR_CALLER_ID }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MIS_RECIPIENTS: ${{ secrets.MIS_RECIPIENTS }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "GitHub variable VITE_SUPABASE_URL is not set - run START-HERE.bat"; exit 1; fi
          node scripts/hyperdrive.mjs
          SECRETS=()
          # Worker secrets (only the ones set in GitHub): MyOperator keys, Gemini (AI), Supabase service key (new logins
          # from Settings > Users), Gmail SMTP app password and MIS recipients. Written to a private temp file, uploaded with the deploy, then deleted.
          umask 077
          node -e 'const e = process.env, o = {}; for (const k of ["GEMINI_API_KEY", "SUPABASE_SERVICE_ROLE_KEY", "MYOPERATOR_WEBHOOK_KEY", "MYOPERATOR_COMPANY_ID", "MYOPERATOR_SECRET_TOKEN", "MYOPERATOR_OBD_API_KEY", "MYOPERATOR_PUBLIC_IVR_ID", "MYOPERATOR_API_TOKEN", "MYOPERATOR_WABA_API_KEY", "MYOPERATOR_WABA_PHONE_ID", "MYOPERATOR_CALLER_ID", "SMTP_PASSWORD", "MIS_RECIPIENTS"]) if (e[k]) o[k] = e[k]; process.stdout.write(JSON.stringify(o))' > "$RUNNER_TEMP/worker-secrets.json"
          if [ "$(cat "$RUNNER_TEMP/worker-secrets.json")" != "{}" ]; then SECRETS=(--secrets-file "$RUNNER_TEMP/worker-secrets.json"); fi
          cd cloudflare
          npx wrangler deploy --config wrangler.deploy.jsonc --var "BUILD_SHA:$(git rev-parse HEAD)" --var "SUPABASE_URL:$SUPABASE_URL" --var "APP_URL:$APP_URL" "${SECRETS[@]}"
          rm -f "$RUNNER_TEMP/worker-secrets.json"

      - name: 6. Smoke test the live site (new version, database, login required)
        run: node scripts/smoke.mjs "$APP_URL" "$(git rev-parse HEAD)"

      - name: 7. Record - commit contracts, tag, deployments table, summary
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/record.mjs success

      - name: Record failure
        if: failure()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/record.mjs failure || true
